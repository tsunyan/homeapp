name: CI

on:
  push:
    branches: [main]
  # No branch filter: the `build` status check is required by branch
  # protection, so it must run on every pull request regardless of base.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit rather than a tag. A tag can be moved to point
# at different code after review, which matters most for the third-party
# scanner: it runs with repository contents in scope on every push.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # WinUI 3 / Windows App SDK, x64 only — must run on a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/HomeApp/HomeApp.csproj -r win-x64

      - name: Build HomeApp.Core
        run: dotnet build src/HomeApp.Core/HomeApp.Core.csproj -c Release --no-restore

      - name: Build HomeApp
        run: dotnet build src/HomeApp/HomeApp.csproj -c Release -r win-x64 --no-restore

      - name: Test
        shell: pwsh
        run: |
          # Split on the platform separator rather than matching a regex: a
          # backslash character class is easy to mangle in transit, and the
          # mistake only surfaces once a test project actually exists.
          $sep = [System.IO.Path]::DirectorySeparatorChar
          $projects = Get-ChildItem -Path . -Filter *.csproj -Recurse | Where-Object {
            $parts = $_.FullName.Split($sep)
            $parts -notcontains 'bin' -and $parts -notcontains 'obj' -and $_.BaseName -match 'Tests?$'
          }
          if (-not $projects) {
            Write-Host 'No test projects found - skipping.'
            exit 0
          }
          foreach ($p in $projects) {
            Write-Host "Testing $($p.FullName)"
            dotnet test $p.FullName -c Release --logger 'trx;LogFileName=test-results.trx'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks reads the pull request's commit list, which the workflow-wide
      # contents-only permission does not cover.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secrets have to be hunted through the whole history, not just the
          # diff: a key removed in a later commit is still published with the
          # repository.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required since v3 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
