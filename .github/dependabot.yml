version: 2
updates:
  # The projects under src/ and tests/. There is no solution file, and NuGet
  # discovery only looks for entry points in the directories it is given, so
  # `directory: "/"` finds no projects. Each directory gets its own grouped
  # pull request; no package is referenced from more than one of them.
  # global.json pins the SDK and is not covered here.
  - package-ecosystem: nuget
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: cron
      cronjob: "0 3 * * 3,6" # Wednesday and Saturday, 03:00
      timezone: Asia/Tokyo
    groups:
      nuget-dependencies:
        patterns: ["*"]

  # Actions are pinned to commit SHAs (see ci.yml), so nothing else bumps them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 3 * * 3,6" # Wednesday and Saturday, 03:00
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
