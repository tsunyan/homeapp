version: 2
updates:
  # The projects under src/ and tests/. global.json pins the SDK and is not
  # covered here.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 3 * * 3,6" # Wednesday and Saturday, 03:00
      timezone: Asia/Tokyo
    groups:
      nuget-dependencies:
        patterns: ["*"]

  # Actions are pinned to commit SHAs (see ci.yml), so nothing else bumps them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 3 * * 3,6" # Wednesday and Saturday, 03:00
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
